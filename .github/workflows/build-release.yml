name: Build and Deploy Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check if Signing Key is Provided
        id: check_signing
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "has_key=true" >> $GITHUB_OUTPUT
            echo "Android release key found. Will configure release signing."
          else
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "No Android release key (SIGNING_KEY) found."
          fi

      - name: Setup Signing Configuration
        if: steps.check_signing.outputs.has_key == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > platform_test_key.jks
          cat <<EOF > signing.properties
          storeFile=platform_test_key.jks
          storePassword=${KEY_STORE_PASSWORD:-android}
          keyAlias=${ALIAS:-platform}
          keyPassword=${KEY_PASSWORD:-android}
          EOF

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename and Prepare APK
        id: prepare_apk
        run: |
          SOURCE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$SOURCE_APK" ]; then
            echo "❌ ERROR: No release APK found!"
            exit 1
          fi
          echo "Found source APK: $SOURCE_APK"

          DATE=$(date +'%Y%m%d')
          COMMIT_HASH=$(git rev-parse --short HEAD)
          APP_NAME="MaterialFiles"
          VERSION=$(sed -n "s/.*versionName *['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)

          if [ -n "$VERSION" ]; then
            NEW_NAME="${APP_NAME}-v${VERSION}-${DATE}-${COMMIT_HASH}.apk"
          else
            NEW_NAME="${APP_NAME}-${DATE}-${COMMIT_HASH}.apk"
          fi

          DEST_PATH="app/build/outputs/apk/release/${NEW_NAME}"
          mv "$SOURCE_APK" "$DEST_PATH"
          echo "Successfully renamed APK to: $DEST_PATH"
          echo "apk_path=${DEST_PATH}" >> $GITHUB_OUTPUT
          echo "apk_name=${NEW_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Upload to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing. Skipping telegram upload."
            exit 0
          fi

          APK_PATH="${{ steps.prepare_apk.outputs.apk_path }}"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ ERROR: Prepared APK file not found at: $APK_PATH"
            exit 1
          fi

          FILE_NAME=$(basename "$APK_PATH")
          echo "Found APK to upload: $FILE_NAME"

          curl -s -S -f -F document=@"$APK_PATH" \
               -F chat_id="$TELEGRAM_CHAT_ID" \
               "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" \
               -F caption="📱 *${FILE_NAME}* 已经成功编译并打包！" \
               -F parse_mode="Markdown" > /dev/null

          echo "✅ 成功推送至 Telegram！"
